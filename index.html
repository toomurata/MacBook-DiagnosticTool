<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 修理後の診断確認ツール</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MacBook 診断確認ツール</h1>
    <p>交換したパーツを選択してください。</p>
</header>

<div class="container">

    <section class="card">

        <h2>交換パーツ</h2>

        <div
            id="partsContainer"
            class="parts-list">
        </div>

    </section>

    <section class="card">

        <h2>必要な診断</h2>

        <div id="count">
            診断数：0
        </div>

        <div id="results">
            パーツを選択してください。
        </div>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
